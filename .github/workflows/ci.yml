name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax and encryption
        run: |
          node --check scripts/state.mjs
          node --check scripts/configure-provider.mjs
          node --check scripts/provider-manager.mjs
          node --test tests/provider-manager.test.mjs
          node scripts/state.mjs self-test

      - name: Test custom provider config generation (dummy credentials only)
        env:
          HOME: ${{ runner.temp }}/provider-test-home
          AI_PROVIDER_ID: test-provider
          AI_PROVIDER_NAME: Test Provider
          AI_BASE_URL: https://api.example.test/v1
          AI_PROVIDER_API_KEY: dummy-test-key-not-a-real-credential
          AI_MODEL_ID: test-model
          AI_MODEL_NAME: Test Model
        run: |
          set -euo pipefail
          node scripts/configure-provider.mjs
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const config = JSON.parse(await readFile(process.env.HOME + "/.config/opencode/opencode.json", "utf8"));
            if (!config.provider?.["test-provider"]?.models?.["test-model"]) throw new Error("Provider/model missing from persistent config");
            if (JSON.stringify(config).includes("dummy-test-key-not-a-real-credential")) throw new Error("API key leaked into config");
            if (config.provider["test-provider"].options.apiKey !== "{env:AI_PROVIDER_API_KEY}") throw new Error("API key env reference missing");
          '
