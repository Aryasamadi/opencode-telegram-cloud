name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax and encryption
        run: |
          node --check scripts/state.mjs
          node --check scripts/configure-provider.mjs
          node scripts/state.mjs self-test

      - name: Test custom provider config generation (dummy credentials only)
        env:
          AI_PROVIDER_ID: test-provider
          AI_PROVIDER_NAME: Test Provider
          AI_BASE_URL: https://api.example.test/v1
          AI_PROVIDER_API_KEY: dummy-test-key-not-a-real-credential
          AI_MODEL_ID: test-model
          AI_MODEL_NAME: Test Model
        run: node scripts/configure-provider.mjs
