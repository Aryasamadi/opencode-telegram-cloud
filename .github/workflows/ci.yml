name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax and encryption
        run: |
          node --check scripts/state.mjs
          node --check scripts/configure-provider.mjs
          node --check scripts/provider-manager.mjs
          node --check scripts/addmodel-command.mjs
          node --check scripts/patch-telegram-bot.mjs
          node --test tests/addmodel-command.test.mjs tests/provider-manager.test.mjs tests/telegram-patch.test.mjs tests/state-roundtrip.test.mjs
          node scripts/state.mjs self-test

      - name: Smoke-test adapter against the latest published Telegram bot package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream-bot/package" "$RUNNER_TEMP/upstream-bot/tarball"
          npm pack --ignore-scripts --silent @grinev/opencode-telegram-bot@latest \
            --pack-destination "$RUNNER_TEMP/upstream-bot/tarball"
          TARBALL="$(find "$RUNNER_TEMP/upstream-bot/tarball" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          tar -xzf "$TARBALL" --strip-components=1 -C "$RUNNER_TEMP/upstream-bot/package"
          DIST="$RUNNER_TEMP/upstream-bot/package/dist"
          OPENCODE_TELEGRAM_DIST="$DIST" node scripts/patch-telegram-bot.mjs
          node --check "$DIST/bot/routers/command-router.js"
          node --check "$DIST/bot/commands/definitions.js"
          grep -q 'bot.command("addmodel"' "$DIST/bot/routers/command-router.js"
          grep -q 'bot.command("opencode_stop", (ctx) => ctx.reply(' "$DIST/bot/routers/command-router.js"
          grep -q 'command: "addmodel"' "$DIST/bot/commands/definitions.js"

      - name: Test custom provider config generation (dummy credentials only)
        env:
          HOME: ${{ runner.temp }}/provider-test-home
          AI_PROVIDER_ID: test-provider
          AI_PROVIDER_NAME: Test Provider
          AI_BASE_URL: https://api.example.test/v1
          AI_PROVIDER_API_KEY: dummy-test-key-not-a-real-credential
          AI_MODEL_ID: test-model
          AI_MODEL_NAME: Test Model
        run: |
          set -euo pipefail
          node scripts/configure-provider.mjs
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const config = JSON.parse(await readFile(process.env.HOME + "/.config/opencode/opencode.json", "utf8"));
            if (!config.provider?.["test-provider"]?.models?.["test-model"]) throw new Error("Provider/model missing from persistent config");
            if (JSON.stringify(config).includes("dummy-test-key-not-a-real-credential")) throw new Error("API key leaked into config");
            if (config.provider["test-provider"].options.apiKey !== "{env:AI_PROVIDER_API_KEY}") throw new Error("API key env reference missing");
          '
