name: OpenCode Telegram Cloud

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencode-telegram-cloud-agent
  cancel-in-progress: false

jobs:
  agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      XDG_DATA_HOME: /home/runner/.local/share
      XDG_STATE_HOME: /home/runner/.local/state
      XDG_CONFIG_HOME: /home/runner/.config
      OPENCODE_TELEGRAM_HOME: /home/runner/.config/opencode-telegram-bot

    steps:
      - name: Checkout cloud controller
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          if [[ ! "${TELEGRAM_ALLOWED_USER_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::TELEGRAM_ALLOWED_USER_ID must be a numeric Telegram user ID"
            exit 1
          fi
          if [[ "${#STATE_ENCRYPTION_KEY}" -lt 32 ]]; then
            echo "::error::Missing or too-short repository secret STATE_ENCRYPTION_KEY (minimum 32 characters)"
            exit 1
          fi

      - name: Install runtime dependencies and latest published OpenCode and Telegram bot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          npm install --global @opencode/cli@latest @grinev/opencode-telegram-bot@latest
          node scripts/patch-telegram-bot.mjs
          node scripts/patch-provider-features.mjs
          opencode --version
          DATABASE_PATH="$(opencode debug paths db)"
          EXPECTED_DATABASE_PATH="$HOME/.local/share/opencode/opencode.db"
          echo "OpenCode session database: $DATABASE_PATH"
          if [[ "$DATABASE_PATH" != "$EXPECTED_DATABASE_PATH" ]]; then
            echo "::error::OpenCode database path does not match the encrypted checkpoint path."
            echo "::error::Expected $EXPECTED_DATABASE_PATH"
            exit 1
          fi
          opencode-telegram --help

      - name: Verify encryption and restore the saved state
        id: restore_state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          STATE_DECRYPTION_KEY: ${{ secrets.STATE_DECRYPTION_KEY || secrets.STATE_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/projects" "$HOME/.local/share/opencode" "$HOME/.local/state/opencode" \
            "$HOME/.config/opencode" "$HOME/.config/opencode-telegram-bot"
          node scripts/state.mjs self-test
          node scripts/state.mjs restore

      - name: Configure optional custom AI provider
        env:
          AI_PROVIDER_ID: ${{ secrets.AI_PROVIDER_ID }}
          AI_PROVIDER_NAME: ${{ secrets.AI_PROVIDER_NAME }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          AI_MODEL_ID: ${{ secrets.AI_MODEL_ID }}
          AI_MODEL_NAME: ${{ secrets.AI_MODEL_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-provider.mjs

      - name: Start isolated OpenCode V2 server
        id: start_opencode
        env:
          # The hosted OpenCode provider is used by the server process, not just the Telegram client.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          SERVER_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SERVER_PASSWORD"
          printf 'OPENCODE_SERVER_PASSWORD=%s\n' "$SERVER_PASSWORD" >> "$GITHUB_ENV"
          printf 'OPENCODE_SERVER_USERNAME=opencode\n' >> "$GITHUB_ENV"

          OPENCODE_SERVER_PASSWORD="$SERVER_PASSWORD" \
            nohup opencode serve --hostname 127.0.0.1 --port 49374 \
            > "$RUNNER_TEMP/opencode-server.log" 2>&1 < /dev/null &
          SERVER_PID=$!
          printf '%s\n' "$SERVER_PID" > "$RUNNER_TEMP/opencode-server.pid"

          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail \
              --user "opencode:$SERVER_PASSWORD" \
              http://127.0.0.1:49374/global/health >/dev/null 2>&1; then
              echo "OpenCode V2 server is healthy on loopback."
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::OpenCode server exited before becoming healthy. See the step logs."
              exit 1
            fi
            sleep 2
          done

          echo "::error::OpenCode server health check timed out."
          exit 1

      - name: Run Telegram bot (maximum 5h 55m)
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_SERVER_VERSION: v2
          OPENCODE_API_URL: http://127.0.0.1:49374
          OPENCODE_SERVER_USERNAME: opencode
          # The upstream startup validator requires these even when model
          # selection is subsequently managed through the Telegram /models UI.
          OPENCODE_MODEL_PROVIDER: opencode
          OPENCODE_MODEL_ID: big-pickle
          OPENCODE_AUTO_RESTART_ENABLED: "false"
          OPENCODE_TELEGRAM_HOME: /home/runner/.config/opencode-telegram-bot
          OPEN_BROWSER_ROOTS: /home/runner/projects
          BOT_HEALTH_PORT: "0"
          BOT_LOCALE: en
          # Keep provider and model menus readable; both are paginated at 10 entries per page.
          MODELS_LIST_LIMIT: "10"
          LOG_LEVEL: info
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 355m opencode-telegram start &
          BOT_PID=$!
          BOT_STATUS=0

          # Persist a consistent encrypted checkpoint every two minutes while the bot is live.
          while kill -0 "$BOT_PID" 2>/dev/null; do
            sleep 120
            if kill -0 "$BOT_PID" 2>/dev/null; then
              echo "Creating periodic checkpoint..."
              if ! bash scripts/checkpoint.sh; then
                echo "::warning::Periodic checkpoint failed; the final shutdown checkpoint will retry."
              fi
            fi
          done

          wait "$BOT_PID" || BOT_STATUS=$?
          if [[ "$BOT_STATUS" -eq 124 ]]; then
            echo "Planned session limit reached; Telegram bot received SIGTERM."
            exit 0
          fi
          if [[ "$BOT_STATUS" -ne 0 ]]; then
            echo "::error::Telegram bot exited with status $BOT_STATUS"
            exit "$BOT_STATUS"
          fi
          echo "Telegram bot exited cleanly before the planned session limit."

      - name: Stop OpenCode server cleanly
        if: always() && steps.start_opencode.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          PID_FILE="$RUNNER_TEMP/opencode-server.pid"
          if [[ -f "$PID_FILE" ]]; then
            SERVER_PID="$(cat "$PID_FILE")"
            kill -TERM "$SERVER_PID" 2>/dev/null || true
            for attempt in $(seq 1 30); do
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                echo "OpenCode server stopped."
                exit 0
              fi
              sleep 1
            done
            echo "::warning::OpenCode server did not stop within 30 seconds; forcing shutdown."
            kill -KILL "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Save encrypted checkpoint to the public repository
        if: always() && steps.restore_state.outcome == 'success'
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/checkpoint.sh
